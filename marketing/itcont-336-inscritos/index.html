<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>ITCONT UEFS — 336 inscritos</title>
<style>
  /* ---------- Fontes locais (OFL) ---------- */
  @font-face { font-family: "Sora";    src: url("fonts/Sora-Variable.ttf") format("truetype");    font-weight: 100 800; font-display: block; }
  @font-face { font-family: "Manrope"; src: url("fonts/Manrope-Variable.ttf") format("truetype"); font-weight: 200 800; font-display: block; }

  /* ---------- Tokens de design ---------- */
  :root {
    --w: 1080px;
    --h: 1350px;
    --safe: 64px;              /* margem de segurança */

    --navy-950: #020817;
    --navy-900: #041033;
    --navy-800: #0a2266;
    --blue-600: #1d4ed8;
    --blue-500: #2563eb;
    --cyan-400: #22d3ee;
    --cyan-300: #67e8f9;
    --sky-300:  #7dd3fc;
    --sky-200:  #bae6fd;
    --ice:      #eaf5ff;
    --gold-200: #fff1c4;
    --gold-300: #ffe08f;
    --gold-400: #f2c55c;
    --gold-500: #d49d34;
    --gold-600: #a4711b;
    --text:      #eef5ff;
    --text-soft: #c3d6f5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); background: var(--navy-950); }

  .stage {
    position: relative;
    width: var(--w);
    height: var(--h);
    overflow: hidden;
    font-family: "Manrope", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse 640px 430px at 50% 330px, rgba(37, 99, 235, .52), transparent 70%),
      radial-gradient(ellipse 430px 250px at 50% 320px, rgba(34, 211, 238, .20), transparent 72%),
      radial-gradient(ellipse 980px 560px at 50% 1350px, rgba(29, 78, 216, .30), transparent 70%),
      radial-gradient(ellipse 520px 520px at 0% 0%, rgba(14, 165, 233, .12), transparent 70%),
      radial-gradient(ellipse 520px 520px at 100% 0%, rgba(14, 165, 233, .10), transparent 70%),
      linear-gradient(180deg, #071a4a 0%, #041236 46%, #030b26 100%);
  }

  /* ---------- Camadas decorativas ---------- */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(125, 211, 252, .07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(125, 211, 252, .07) 1px, transparent 1px);
    background-size: 54px 54px;
    background-position: 0 0;
    -webkit-mask-image: radial-gradient(ellipse 600px 470px at 50% 330px, #000 0%, rgba(0,0,0,.35) 55%, transparent 80%);
            mask-image: radial-gradient(ellipse 600px 470px at 50% 330px, #000 0%, rgba(0,0,0,.35) 55%, transparent 80%);
  }
  .deco { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ---------- Bloco principal ---------- */
  .center { position: absolute; left: 0; right: 0; text-align: center; }

  .eyebrow {
    top: 72px;
    display: flex; align-items: center; justify-content: center; gap: 26px;
  }
  .eyebrow span {
    font-family: "Sora", sans-serif;
    font-weight: 600;
    font-size: 38px;
    line-height: 1;
    letter-spacing: .36em;
    padding-left: .36em;          /* compensa o espaçamento da última letra */
    color: var(--sky-200);
    text-shadow: 0 0 24px rgba(34, 211, 238, .45);
  }
  .eyebrow i {
    display: block; width: 86px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--gold-400));
    position: relative;
  }
  .eyebrow i:last-child { background: linear-gradient(90deg, var(--gold-400), transparent); }
  .eyebrow i::after {
    content: ""; position: absolute; top: 50%; width: 8px; height: 8px;
    background: var(--gold-300); transform: translateY(-50%) rotate(45deg);
    box-shadow: 0 0 10px rgba(242, 197, 92, .8);
  }
  .eyebrow i:first-child::after { right: -2px; }
  .eyebrow i:last-child::after  { left: -2px; }

  /* 336 — número protagonista, em duas camadas: extrusão + face */
  .hero { top: 124px; height: 320px; }
  .hero .num {
    position: absolute; left: 0; right: 0; top: 0;
    font-family: "Sora", sans-serif;
    font-weight: 800;
    font-size: 340px;
    line-height: 1;
    letter-spacing: -.035em;
    padding-right: .035em;        /* compensa o espaçamento negativo e centraliza */
  }
  .hero .num.depth {
    color: #2a5bd0;
    text-shadow:
      0 1px 0 #2856c8, 0 2px 0 #2450bc, 0 3px 0 #2049ae, 0 4px 0 #1c42a0,
      0 5px 0 #183a90, 0 6px 0 #143280, 0 7px 0 #102a70, 0 8px 0 #0d2462,
      0 22px 34px rgba(0, 4, 20, .65),
      0 0 70px rgba(34, 211, 238, .35);
  }
  .hero .num.face {
    background: linear-gradient(180deg, #ffffff 0%, #f3f9ff 34%, #cfe7ff 56%, #8cc6ff 80%, #6fb5ff 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    -webkit-text-stroke: 1.2px rgba(220, 240, 255, .55);
  }
  .hero .num.shine {
    background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.65) 46%, transparent 54%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    mix-blend-mode: screen; opacity: .55;
  }

  .headline {
    top: 462px;
    font-family: "Sora", sans-serif;
    font-weight: 800;
    font-size: 92px;
    line-height: 1;
    letter-spacing: .07em;
    padding-left: .07em;
  }
  .headline span {
    background: linear-gradient(180deg, #e9fdff 0%, var(--cyan-300) 55%, #22b8e6 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 6px 18px rgba(34, 211, 238, .35));
  }

  /* ---------- Cards ---------- */
  .cards {
    position: absolute; top: 592px; left: var(--safe); right: var(--safe);
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px;
  }
  .card {
    position: relative;
    height: 318px;
    padding: 28px 18px 0;
    border-radius: 30px;
    text-align: center;
    border: 1.5px solid transparent;
    background:
      linear-gradient(165deg, rgba(36, 86, 210, .55) 0%, rgba(12, 34, 102, .72) 48%, rgba(6, 18, 58, .88) 100%) padding-box,
      linear-gradient(160deg, rgba(125, 211, 252, .85) 0%, rgba(59, 130, 246, .25) 38%, rgba(59, 130, 246, .12) 62%, rgba(242, 197, 92, .55) 100%) border-box;
    box-shadow:
      0 26px 50px rgba(0, 3, 18, .55),
      0 0 34px rgba(34, 211, 238, .10),
      inset 0 1px 0 rgba(255, 255, 255, .14);
  }
  .card::before {                       /* reflexo superior */
    content: ""; position: absolute; left: 22px; right: 22px; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(186, 230, 253, .9), transparent);
  }
  .icon {
    width: 64px; height: 64px; margin: 0 auto;
    border-radius: 50%;
    display: grid; place-items: center;
    color: var(--cyan-300);
    background: radial-gradient(circle at 50% 35%, rgba(34, 211, 238, .26), rgba(34, 211, 238, .06) 70%);
    box-shadow: inset 0 0 0 1px rgba(125, 211, 252, .45), 0 0 22px rgba(34, 211, 238, .25);
  }
  .icon svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  .card .value {
    margin-top: 16px;
    font-family: "Sora", sans-serif;
    font-weight: 800;
    font-size: 88px;
    line-height: 1;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums lining-nums;
    background: linear-gradient(180deg, #ffffff 0%, #e4f2ff 55%, #9fd0ff 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 4px 10px rgba(0, 6, 30, .55));
  }
  .card .rule {
    width: 34px; height: 3px; margin: 16px auto 15px; border-radius: 3px;
    background: linear-gradient(90deg, var(--gold-500), var(--gold-300), var(--gold-500));
    box-shadow: 0 0 10px rgba(242, 197, 92, .55);
  }
  .card .label {
    font-family: "Manrope", sans-serif;
    font-weight: 700;
    font-size: 27px;
    line-height: 1.18;
    color: var(--text-soft);
  }

  /* ---------- Encerramento ---------- */
  .closing {
    top: 950px;
    font-family: "Sora", sans-serif;
    font-weight: 600;
    font-size: 38px;
    line-height: 1.26;
    color: var(--text);
    letter-spacing: -.005em;
  }
  .closing .gold {
    font-weight: 700;
    background: linear-gradient(180deg, var(--gold-200) 0%, var(--gold-300) 35%, var(--gold-400) 65%, var(--gold-500) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }

  /* ---------- Assinatura (logos) ---------- */
  .signature {
    position: absolute; left: 50%; bottom: var(--safe);
    transform: translateX(-50%);
    width: 800px; height: 196px;
    border-radius: 28px;
    display: flex; align-items: center; justify-content: center; gap: 64px;
    background: linear-gradient(180deg, #ffffff 0%, #f1f6fd 60%, #e3ecf8 100%);
    box-shadow:
      0 30px 60px rgba(0, 3, 18, .6),
      0 0 0 1px rgba(255, 255, 255, .7),
      0 0 46px rgba(34, 211, 238, .18);
  }
  .signature::before {                 /* filete dourado superior */
    content: ""; position: absolute; top: -1px; left: 180px; right: 180px; height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, transparent, var(--gold-400), var(--gold-300), var(--gold-400), transparent);
  }
  .signature .divider {
    width: 1.5px; height: 120px;
    background: linear-gradient(180deg, transparent, rgba(10, 34, 102, .28), transparent);
  }
  .logo-itcont { height: 160px; width: auto; display: block; }
  .logo-cda    { height: 150px; width: auto; display: block; }

  /* ---------- Guias (somente com ?guides) ---------- */
  .guides { display: none; position: absolute; inset: var(--safe); outline: 2px dashed rgba(255, 0, 140, .9); pointer-events: none; }
  .guides::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; border-left: 1px dashed rgba(255, 0, 140, .6); }
  .show-guides .guides { display: block; }
</style>
</head>
<body>
<div class="stage" id="stage">

  <!-- grade tecnológica -->
  <div class="grid"></div>

  <!-- circuitos, plataforma de luz e brilhos -->
  <svg class="deco" viewBox="0 0 1080 1350" aria-hidden="true">
    <defs>
      <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#67e8f9" stop-opacity=".05"/>
        <stop offset=".55" stop-color="#67e8f9" stop-opacity=".38"/>
        <stop offset="1" stop-color="#7dd3fc" stop-opacity=".55"/>
      </linearGradient>
      <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#d49d34" stop-opacity="0"/>
        <stop offset=".5" stop-color="#ffe08f"/>
        <stop offset="1" stop-color="#d49d34" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
        <stop offset=".3" stop-color="#22d3ee" stop-opacity=".7"/>
        <stop offset=".5" stop-color="#ffffff"/>
        <stop offset=".7" stop-color="#22d3ee" stop-opacity=".7"/>
        <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="pool" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#38bdf8" stop-opacity=".55"/>
        <stop offset=".6" stop-color="#2563eb" stop-opacity=".18"/>
        <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
      </radialGradient>
      <filter id="soft" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="6"/></filter>

      <!-- traçado de circuito (canto superior esquerdo) -->
      <g id="circuit" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g stroke="url(#trace)" stroke-width="1.6">
          <path d="M0 250 H64 L112 202 H214"/>
          <path d="M0 278 H92 L132 318 H176"/>
          <path d="M30 0 V62 L76 108 V160"/>
          <path d="M92 0 V30 L128 66 H200 L228 38 H272"/>
          <path d="M0 150 H30 L58 122"/>
        </g>
        <g stroke="#7dd3fc" stroke-opacity=".7" stroke-width="1.5">
          <circle cx="214" cy="202" r="4.5"/>
          <circle cx="176" cy="318" r="4.5"/>
          <circle cx="76"  cy="160" r="4.5"/>
          <circle cx="58"  cy="122" r="4"/>
        </g>
        <circle cx="272" cy="38" r="4.5" stroke="#f2c55c" stroke-width="1.5"/>
        <g fill="#bae6fd" fill-opacity=".9">
          <circle cx="214" cy="202" r="1.6"/>
          <circle cx="176" cy="318" r="1.6"/>
          <circle cx="76"  cy="160" r="1.6"/>
        </g>
        <circle cx="272" cy="38" r="1.6" fill="#ffe08f"/>
      </g>

      <!-- brilho dourado de 4 pontas -->
      <path id="spark" d="M0 -12 C1 -4 4 -1 12 0 C4 1 1 4 0 12 C-1 4 -4 1 -12 0 C-4 -1 -1 -4 0 -12Z"/>
    </defs>

    <!-- circuitos nos quatro cantos -->
    <use href="#circuit"/>
    <use href="#circuit" transform="translate(1080 0) scale(-1 1)"/>
    <use href="#circuit" transform="translate(0 1350) scale(1 -1)" opacity=".75"/>
    <use href="#circuit" transform="translate(1080 1350) scale(-1 -1)" opacity=".75"/>

    <!-- plataforma de luz sob o 336 -->
    <ellipse cx="540" cy="428" rx="420" ry="54" fill="url(#pool)"/>
    <ellipse cx="540" cy="428" rx="392" ry="40" fill="none" stroke="#67e8f9" stroke-opacity=".22" stroke-width="1.2"/>
    <ellipse cx="540" cy="428" rx="330" ry="30" fill="none" stroke="#67e8f9" stroke-opacity=".35" stroke-width="1.2" stroke-dasharray="2 9"/>
    <g fill="none" stroke="#f2c55c" stroke-width="2.4" stroke-linecap="round">
      <path d="M895.3 411.1 A392 40 0 0 1 895.3 444.9"/>
      <path d="M184.7 444.9 A392 40 0 0 1 184.7 411.1"/>
    </g>
    <rect x="190" y="426" width="700" height="4" rx="2" fill="url(#beam)" filter="url(#soft)"/>
    <rect x="160" y="427" width="760" height="1.6" rx=".8" fill="url(#beam)"/>

    <!-- brilhos dourados pontuais -->
    <g fill="#ffe08f">
      <use href="#spark" transform="translate(905 170) scale(1.25)"/>
      <use href="#spark" transform="translate(938 214) scale(.6)" fill-opacity=".8"/>
      <use href="#spark" transform="translate(166 392) scale(.85)" fill-opacity=".9"/>
    </g>

    <!-- partículas -->
    <g fill="#bae6fd">
      <circle cx="150" cy="560" r="1.6" opacity=".5"/>
      <circle cx="232" cy="140" r="1.4" opacity=".45"/>
      <circle cx="850" cy="138" r="1.4" opacity=".45"/>
      <circle cx="958" cy="552" r="1.8" opacity=".5"/>
      <circle cx="988" cy="380" r="1.2" opacity=".4"/>
      <circle cx="96"  cy="440" r="1.3" opacity=".4"/>
      <circle cx="1000" cy="930" r="1.4" opacity=".4"/>
      <circle cx="84"  cy="930" r="1.4" opacity=".4"/>
      <circle cx="690" cy="108" r="1.2" opacity=".35"/>
      <circle cx="372" cy="560" r="1.2" opacity=".35"/>
    </g>
  </svg>

  <!-- ALCANÇAMOS -->
  <div class="center eyebrow"><i></i><span>ALCANÇAMOS</span><i></i></div>

  <!-- 336 -->
  <div class="center hero" aria-label="336">
    <div class="num depth">336</div>
    <div class="num face">336</div>
    <div class="num shine">336</div>
  </div>

  <!-- INSCRITOS! -->
  <div class="center headline"><span>INSCRITOS!</span></div>

  <!-- Cards -->
  <div class="cards">
    <article class="card">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>
      </div>
      <div class="value">276</div>
      <div class="rule"></div>
      <div class="label">Discentes</div>
    </article>

    <article class="card">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/><path d="M8 11.5l2.5-2.5 2 2 3.5-3.5"/></svg>
      </div>
      <div class="value">19</div>
      <div class="rule"></div>
      <div class="label">Docentes</div>
    </article>

    <article class="card">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M12 12h.01"/><path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M22 13a18.15 18.15 0 0 1-20 0"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg>
      </div>
      <div class="value">41</div>
      <div class="rule"></div>
      <div class="label">Profissionais<br>contábeis</div>
    </article>
  </div>

  <!-- Encerramento -->
  <div class="center closing">Obrigado por fazer parte<br>dessa <span class="gold">transformação!</span></div>

  <!-- Assinatura com logos oficiais -->
  <div class="signature">
    <img class="logo-itcont" src="assets/logo-itcont-recorte.png" alt="I Imersão Tecnológica Contábil — ITCONT">
    <span class="divider"></span>
    <img class="logo-cda" src="assets/logo-contador-do-amanha-recorte.png" alt="Contador do Amanhã">
  </div>

  <div class="guides"></div>
</div>
<script>
  if (new URLSearchParams(location.search).has("guides")) document.body.classList.add("show-guides");
</script>
</body>
</html>
