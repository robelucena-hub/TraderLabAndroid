<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ITCONT — Anna Clara Silva</title>
<style>
@font-face{font-family:Sora;src:url(fonts/Sora.ttf);font-weight:100 900}
@font-face{font-family:Inter;src:url(fonts/Inter.ttf);font-weight:100 900}
@font-face{font-family:JBM;src:url(fonts/JetBrainsMono.ttf);font-weight:100 900}
:root{--navy:#0A1B3F;--navy-deep:#06122B;--blue:#1F5EFF;--blue-2:#3B82F6;--cyan:#22D3EE;--ice:#EAF1FF}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:1080px;height:3840px;overflow:hidden;background:transparent}
.layer{position:absolute;left:0;width:1080px;height:1920px;overflow:hidden}
#back{top:0} #front{top:1920px}
.abs{position:absolute}
.sora{font-family:Sora} .inter{font-family:Inter} .mono{font-family:JBM}
.mask{overflow:hidden}
.mask:not(.abs){position:relative}
.mask>span{display:block}
.card{background:rgba(10,27,63,.90);border:1.5px solid rgba(59,130,246,.6);border-radius:22px;box-shadow:0 18px 40px rgba(0,0,0,.35);color:#fff}
.lbl{font-family:JBM;font-weight:700;font-size:23px;letter-spacing:3px;color:var(--cyan)}
.plate{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(234,241,255,.96));border-radius:24px;overflow:hidden;
       box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 0 0 2px rgba(34,211,238,.6)}
.plate img,.shine{position:absolute}
.shine{-webkit-mask-image:url(itcont_logo_trim.png);-webkit-mask-size:100% 100%;mask-image:url(itcont_logo_trim.png);mask-size:100% 100%;
       background:linear-gradient(100deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.8) 50%,rgba(255,255,255,0) 60%);background-size:300% 100%}
.hl{color:#5BE7F7}
svg{overflow:visible}
</style>
</head>
<body>
<!-- ===================== CAMADA DE TRÁS (atrás da apresentadora) ===================== -->
<div id="back" class="layer">
  <!-- faixa escura no topo (melhora a leitura sobre o pôster) e na parede esquerda -->
  <div id="scrimTop" class="abs" style="left:0;top:0;width:1080px;height:640px;background:linear-gradient(180deg,rgba(6,18,43,.88) 0,rgba(6,18,43,.74) 300px,rgba(6,18,43,0) 620px)"></div>
  <div id="scrimLeft" class="abs" style="left:0;top:380px;width:520px;height:700px;background:radial-gradient(420px 520px at 160px 320px,rgba(6,18,43,.55),rgba(6,18,43,0))"></div>
  <svg id="grid" class="abs" width="1080" height="1920" style="left:0;top:0">
    <defs>
      <linearGradient id="gfade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".35" stop-color="#fff" stop-opacity=".5"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <mask id="gmask"><rect x="0" y="0" width="1080" height="1300" fill="url(#gfade)"/></mask>
    </defs>
    <g mask="url(#gmask)"><g id="gridLines"></g></g>
  </svg>
  <svg id="circ" class="abs" width="1080" height="1920" style="left:0;top:0"><g id="circG"></g></svg>
  <svg id="parts" class="abs" width="1080" height="1920" style="left:0;top:0"><g id="partG"></g></svg>

  <!-- GANCHO -->
  <div id="hook" class="abs sora" style="left:0;top:250px;width:1080px;text-align:center;font-weight:800;color:#fff">
    <div class="mask" style="height:66px"><span id="h1" style="font-size:52px;line-height:66px;letter-spacing:1px;color:var(--ice)">O FUTURO DA CONTABILIDADE</span></div>
    <div class="mask" style="height:84px"><span id="h2" style="font-size:70px;line-height:84px;letter-spacing:2px;background:linear-gradient(90deg,#22D3EE 0%,#22D3EE 40%,#ffffff 50%,#22D3EE 60%,#22D3EE 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent">ESTÁ CHEGANDO</span></div>
    <div id="hline" style="margin:8px auto 0;height:4px;width:520px;background:linear-gradient(90deg,rgba(34,211,238,0),#22D3EE,rgba(34,211,238,0))"></div>
  </div>

  <!-- LOGO OFICIAL (placa clara) + UEFS -->
  <div id="logoBadge" class="abs plate" style="left:64px;top:240px;width:396px;height:225px">
    <img src="itcont_logo_trim.png" style="left:12px;top:10px;width:372px;height:205px">
    <div id="logoShine" class="shine" style="left:12px;top:10px;width:372px;height:205px"></div>
  </div>
  <div id="uefs" class="abs" style="left:64px;top:480px;display:flex;align-items:center;gap:10px">
    <span class="mono" style="font-size:24px;font-weight:700;letter-spacing:3px;color:var(--cyan)">NA</span>
    <span class="sora" style="font-size:34px;font-weight:800;letter-spacing:4px;color:#fff;background:var(--blue);padding:4px 16px;border-radius:10px">UEFS</span>
  </div>

  <!-- DATA E HORÁRIO (parede azul à esquerda) -->
  <div id="cDate" class="abs card" style="left:64px;top:548px;width:300px;height:150px;padding:16px 18px">
    <div style="display:flex;align-items:center;gap:12px">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.8v3.4M16 2.8v3.4"/></svg>
      <span class="lbl">DATA</span></div>
    <div style="display:flex;align-items:baseline;gap:12px;margin-top:6px;white-space:nowrap">
      <span id="d22" class="sora" style="font-size:72px;font-weight:800;line-height:78px">22</span>
      <span id="dMonth" class="sora" style="font-size:27px;font-weight:700;line-height:34px;white-space:nowrap">de outubro</span>
    </div>
  </div>
  <div id="cTime" class="abs card" style="left:64px;top:714px;width:300px;height:120px;padding:16px 18px">
    <div style="display:flex;align-items:center;gap:12px">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>
      <span class="lbl">HORÁRIO</span></div>
    <div id="t19" class="sora" style="font-size:52px;font-weight:800;line-height:60px;margin-top:2px">19h</div>
  </div>

  <!-- TECNOLOGIA × MUNDO CONTÁBIL -->
  <div id="tec" class="abs" style="left:0;top:248px;width:1080px;height:200px">
    <div class="abs mask" style="left:64px;top:0;height:84px;width:700px"><span id="tec1" class="sora" style="font-size:68px;font-weight:800;line-height:84px;color:var(--cyan);letter-spacing:1px">TECNOLOGIA</span></div>
    <svg class="abs" width="1080" height="200" style="left:0;top:0"><path id="tecPath" d="M520 42 H700 L740 82 V112 H780" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle id="tecDot" cx="520" cy="42" r="7" fill="#22D3EE"/></svg>
    <div class="abs mono" id="tecLbl" style="left:64px;top:88px;font-size:28px;font-weight:700;letter-spacing:3px;color:var(--ice)">ALINHADA AO</div>
    <div class="abs mask" style="right:64px;top:84px;height:84px;width:760px;text-align:right"><span id="tec2" class="sora" style="font-size:62px;font-weight:800;line-height:84px;color:#fff">MUNDO CONTÁBIL</span></div>
  </div>

</div>

<!-- ===================== CAMADA DA FRENTE ===================== -->
<div id="front" class="layer">
  <!-- tarja -->
  <div id="lt" class="abs" style="left:60px;top:900px">
    <div id="ltBar" class="abs" style="left:0;top:0;width:10px;height:150px;background:linear-gradient(#22D3EE,#1F5EFF);border-radius:5px;transform-origin:top"></div>
    <div id="ltName" class="abs sora" style="left:22px;top:0;white-space:nowrap;background:rgba(10,27,63,.95);color:#fff;font-size:52px;font-weight:700;padding:8px 26px 10px;border-radius:6px 14px 14px 6px;line-height:66px">Anna Clara Silva</div>
    <div id="ltRole" class="abs sora" style="left:22px;top:94px;white-space:nowrap;background:var(--blue);color:#fff;font-size:34px;font-weight:800;padding:8px 26px 10px;border-radius:6px 14px 14px 6px;line-height:42px">Contadora</div>
  </div>
  <!-- legendas -->
  <div id="cap" class="abs" style="left:130px;width:820px;top:1100px;display:flex;justify-content:center">
    <div id="capBox" class="inter" style="background:rgba(7,20,46,.88);border-radius:16px;padding:10px 24px 12px;color:#fff;font-size:42px;font-weight:700;line-height:52px;text-align:center;max-width:820px;text-wrap:balance"></div>
  </div>
  <!-- transição do gancho -->
  <div id="shutter" class="abs" style="left:0;top:0;width:1080px;height:2400px;background:linear-gradient(180deg,#22D3EE 0,#1F5EFF 8px,#0A1B3F 30px,#0A1B3F 2370px,#1F5EFF 2392px,#22D3EE 2400px)"></div>
  <!-- encerramento -->
  <div id="close" class="abs" style="left:0;top:0;width:1080px;height:1920px;overflow:hidden">
    <div class="abs" style="inset:0;background:radial-gradient(1000px 900px at 540px 700px,#15357f 0%,#0A1B3F 50%,#06122B 100%)"></div>
    <svg class="abs" width="1080" height="1920" style="left:0;top:0"><g id="closeGrid" stroke="#22D3EE" stroke-opacity=".10" stroke-width="1.5"></g><g id="closeCirc"></g><g id="closeParts"></g></svg>
    <div id="clEdge" class="abs" style="left:0;top:0;width:1080px;height:6px;background:linear-gradient(90deg,#1F5EFF,#22D3EE,#1F5EFF)"></div>
    <div id="cl1" class="abs plate" style="left:90px;top:240px;width:900px;height:508px;border-radius:30px">
      <img src="itcont_logo_trim.png" style="left:28px;top:22px;width:844px;height:464px">
      <div id="clShine" class="shine" style="left:28px;top:22px;width:844px;height:464px"></div>
    </div>
    <div id="clName" class="abs" style="left:0;top:792px;width:1080px;text-align:center;color:#fff">
      <div class="mono" style="font-size:26px;font-weight:700;letter-spacing:5px;color:var(--cyan)">COM</div>
      <div class="sora" style="font-size:56px;font-weight:800;line-height:68px;margin-top:4px">Anna Clara Silva</div>
      <div class="inter" style="font-size:32px;font-weight:600;color:var(--ice)">Contadora</div>
    </div>
    <div id="clDiv" class="abs" style="left:240px;top:990px;width:600px;height:2px;background:linear-gradient(90deg,rgba(34,211,238,0),#22D3EE,rgba(34,211,238,0));transform-origin:center"></div>
    <div id="clInfo" class="abs inter" style="left:0;top:1022px;width:1080px;display:flex;flex-direction:column;align-items:center;gap:14px;font-size:36px;font-weight:600;color:#fff"></div>
    <div id="clCta" class="abs" style="left:0;top:1180px;width:1080px;display:flex;justify-content:center">
      <div class="sora" style="background:var(--blue);border-radius:26px;padding:20px 44px 22px;font-size:44px;font-weight:800;line-height:56px;color:#fff;text-align:center;box-shadow:0 0 0 2px rgba(34,211,238,.45),0 20px 50px rgba(31,94,255,.35)">Participe do ITCONT.<br><span style="color:#CFF8FF">Esperamos você!</span></div>
    </div>
    <div id="clOrg" class="abs" style="left:0;top:1376px;width:1080px;text-align:center;color:#fff">
      <div class="mono" style="font-size:24px;font-weight:700;letter-spacing:5px;color:var(--cyan)">REALIZAÇÃO</div>
      <div class="sora" style="font-size:30px;font-weight:700;margin-top:6px">Projeto de Extensão Contador do Amanhã</div>
    </div>
  </div>
  <!-- FINAL (frente, acima da cortina): VAI TRACIONAR O MUNDO CONTÁBIL -->
  <div id="fin" class="abs sora" style="left:0;top:250px;width:1080px;text-align:center;font-weight:800">
    <div class="mask" style="height:76px"><span id="fin1" style="font-size:58px;line-height:76px;color:#fff;letter-spacing:1px">VAI <span style="color:var(--cyan)">TRACIONAR</span></span></div>
    <div class="mask" style="height:84px"><span id="fin2" style="font-size:66px;line-height:84px;color:#fff">O MUNDO CONTÁBIL</span></div>
  </div>
</div>
<script src="timeline.js"></script>
<script src="anim.js"></script>
</body>
</html>
