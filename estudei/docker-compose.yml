# Banco PostgreSQL para desenvolvimento local.
# Uso: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: estudei
      POSTGRES_PASSWORD: estudei
      POSTGRES_DB: estudei
    ports:
      - "5432:5432"
    volumes:
      - estudei-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estudei"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  estudei-pg:
